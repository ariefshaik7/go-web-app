name: CI-CD

on:
  push:
    branches:
      - master
      - main

env:
  AWS_REGION: us-west-2
  IMAGE_TAG: ${{ github.sha }}
  ECR_REPO: my-ecr
  VALUES_FILE_PATH: values.yaml

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.22'

      - name: Build
        run: go build -o myapp

      - name: Test
        run: go test ./...

  code-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up GolangCI-Lint
        uses: golangci/golangci-lint-action@v4
        with:
          version: latest

  push-to-amazon-ecr:
    runs-on: ubuntu-latest
    needs: build
    steps:
        - name: Checkout code
          uses: actions/checkout@v4

        - name: Configure AWS credentials
          uses: aws-actions/configure-aws-credentials@v4
          with:
            aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
            aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
            aws-region: ${{ env.AWS_REGION }}

        - name: Login to Amazon ECR
          id: login-ecr
          uses: aws-actions/amazon-ecr-login@v2

        - name: Build, tag, and push docker image to Amazon ECR
          env:
            REGISTRY: ${{ steps.login-ecr.outputs.registry }}
            REPOSITORY: ${{ env.ECR_REPO }}
            IMAGE_TAG: ${{ env.IMAGE_TAG }}
          run: |
            docker build -t $REGISTRY/$REPOSITORY:$IMAGE_TAG .
            docker push $REGISTRY/$REPOSITORY:$IMAGE_TAG
  
  update-newtag-in-helm:
    runs-on: ubuntu-latest
    needs: push-to-amazon-ecr
    steps:
      - name: Checkout Helm Repository
        uses: actions/checkout@v4
        with: 
          repository: ariefshaik7/helm-charts
          token: ${{ secrets.TOKEN }}
          path: helm-repo
      
      - name: Update tag and push to Helm Repo
        working-directory: helm-repo 
        run: |
          # Use the environment variable for consistency
          sed -i "s/tag: .*/tag: '${{ env.IMAGE_TAG }}'/" ${{ env.VALUES_FILE_PATH }}

          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          git add ${{ env.VALUES_FILE_PATH }}
          
          if git diff --staged --quiet; then
            echo "No changes to commit. Image tag is already up to date."
          else
            git commit -m "chore(release): update image tag to ${{ env.IMAGE_TAG }}"
            git push
          fi